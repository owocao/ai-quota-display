<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>AI Quota</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    /* 主舞台：四周留出足够安全边距，确保 ±3px 防烧屏微移不裁切 */
    .stage {
      width: 100%;
      height: 100%;
      padding: 8px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      background: #000000;
      transition: transform 1.2s ease-in-out;
      will-change: transform;
    }

    /* ================= 极简弱化顶栏 ================= */
    .topbar {
      height: 24px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .clock-wrap {
      display: flex;
      align-items: baseline;
    }
    .clock {
      font-size: 13.5px;
      font-weight: 600;
      color: #b8c2d0;
      letter-spacing: 0.4px;
      margin-right: 8px;
    }
    .date {
      font-size: 11px;
      color: #5a6372;
    }

    .sync-wrap {
      display: flex;
      align-items: center;
    }
    .sync-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }
    .sync-dot.loading {
      background: #f59e0b;
    }
    .sync-dot.error {
      background: #ef4444;
    }
    .sync-info {
      font-size: 11px;
      color: #687282;
      margin-right: 10px;
      white-space: nowrap;
    }
    .sync-info.warn {
      color: #eab308;
    }
    .sync-info.error {
      color: #f87171;
    }
    .btn-refresh {
      height: 21px;
      padding: 0 9px;
      border-radius: 11px;
      background: #0e1116;
      border: 1px solid #262d38;
      color: #adb7c6;
      font-size: 11px;
      font-weight: 500;
      line-height: 19px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      white-space: nowrap;
    }
    .btn-refresh:active {
      background: #1a202a;
      color: #f1f5f9;
    }

    /* ================= 主体左右双栏 ================= */
    .main-grid {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: #090b0e;
      border: 1px solid #1c212b;
      border-radius: 11px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-left {
      margin-right: 10px;
    }

    .panel-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      min-height: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .brand-name {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #f1f5f9;
      margin-right: 7px;
      white-space: nowrap;
    }
    .plan-badge {
      font-size: 10px;
      font-weight: 700;
      border-radius: 4px;
      padding: 1px 6px;
      white-space: nowrap;
      line-height: 1.4;
    }
    .plan-codex {
      color: #34d399;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.4);
      text-transform: uppercase;
    }
    .plan-agy {
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(96, 165, 250, 0.4);
      font-weight: 600;
    }
    .plan-offline {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.45);
      text-transform: uppercase;
    }
    .credits-text {
      font-size: 12px;
      font-weight: 500;
      color: #a8b3c2;
      white-space: nowrap;
      margin-left: 8px;
    }
    .stale-badge {
      font-size: 10px;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 6px;
      max-width: 110px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* ================= 配额子卡 ================= */
    .codex-meters {
      flex: none;
      height: 45%;
      min-height: 116px;
      display: flex;
      margin-bottom: 10px;
    }
    .agy-meters {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .agy-row {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .agy-row + .agy-row {
      margin-top: 9px;
    }

    .meter-card {
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: #0d1015;
      border: 1px solid #1b2029;
      border-radius: 9px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .meter-card + .meter-card {
      margin-left: 9px;
    }
    .meter-card.low-border {
      border-color: rgba(239, 68, 68, 0.38);
    }

    .meter-tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 500;
      border-radius: 4px;
      padding: 2px 7px;
      line-height: 1.25;
      color: #8b95a5;
      background: #171c24;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meter-tag.tag-gemini {
      color: #7dd3fc;
      background: rgba(14, 165, 233, 0.14);
    }
    .meter-tag.tag-3p {
      color: #c4b5fd;
      background: rgba(129, 140, 248, 0.14);
    }

    .meter-value {
      font-size: 33px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.5px;
      color: #f8fafc;
      white-space: nowrap;
    }
    .meter-value.inactive {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #5a6372;
    }
    .meter-value small {
      font-size: 62%;
      font-weight: 600;
      margin-left: 1px;
    }

    /* 连续无切断进度条：左对齐，随剩余比例从右向左缩减 */
    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 4px;
      background: #1a1f28;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.35s ease, background 0.35s ease;
    }
    .meter-sub {
      font-size: 10.5px;
      color: #7d8796;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meter-sub.muted {
      color: #4b5361;
    }

    /* ================= 重置卡区（0 ~ 6+ 张自适应） ================= */
    .reset-section {
      flex: 1;
      min-height: 0;
      border-top: 1px solid #191e27;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .reset-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .reset-count-wrap {
      display: flex;
      align-items: baseline;
    }
    .reset-label {
      font-size: 11.5px;
      color: #8b95a5;
      margin-right: 7px;
    }
    .reset-num {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1;
      margin-right: 3px;
    }
    .reset-unit {
      font-size: 11.5px;
      color: #94a3b8;
    }
    .reset-overflow-note {
      font-size: 10px;
      color: #64748b;
      margin-left: 6px;
      white-space: nowrap;
    }
    .reset-next-badge {
      font-size: 10.5px;
      border-radius: 10px;
      padding: 2px 8px;
      white-space: nowrap;
      color: #94a3b8;
      background: #131720;
      border: 1px solid #232a36;
    }
    .reset-next-badge.urgent {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.13);
      border-color: rgba(245, 158, 11, 0.42);
    }

    .reset-grid-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .reset-empty {
      font-size: 12px;
      color: #4b5361;
      text-align: center;
    }
    .reset-grid {
      display: grid;
      grid-gap: 6px;
      gap: 6px;
    }
    .reset-grid.cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .reset-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .reset-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .card-chip {
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.2;
      border: 1px solid #232934;
      background: #0f1319;
      color: #aeb8c6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-chip.urgent {
      border-color: rgba(217, 119, 6, 0.78);
      background: rgba(245, 158, 11, 0.11);
      color: #fbbf24;
      font-weight: 600;
    }

    /* 异常提示块 */
    .error-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: #f87171;
      background: rgba(239, 68, 68, 0.06);
      border: 1px dashed rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      word-break: break-word;
    }

    /* 竖屏访问兜底 */
    @media (orientation: portrait) {
      .main-grid {
        flex-direction: column;
      }
      .panel-left {
        margin-right: 0;
        margin-bottom: 10px;
      }
      .meter-value {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- 顶部极简状态栏 -->
    <div class="topbar">
      <div class="clock-wrap">
        <span class="clock" id="clock">--:--</span>
        <span class="date" id="date">--月--日 周-</span>
      </div>
      <div class="sync-wrap">
        <span class="sync-dot" id="syncDot"></span>
        <span class="sync-info" id="syncInfo">等待同步</span>
        <button class="btn-refresh" id="refreshBtn" type="button">↻ 刷新</button>
      </div>
    </div>

    <!-- 主体双栏 -->
    <div class="main-grid">
      <!-- 左侧：CODEX -->
      <section class="panel panel-left" id="codexPanel">
        <div class="panel-head">
          <div class="brand">
            <span class="brand-name">CODEX</span>
            <span class="plan-badge plan-codex" id="codexPlan">--</span>
            <span class="stale-badge" id="codexStale" style="display:none;"></span>
          </div>
          <span class="credits-text" id="codexCredits">-- Credits</span>
        </div>
        <div class="codex-meters" id="codexMeters"></div>
        <div class="reset-section" id="codexResetSection"></div>
      </section>

      <!-- 右侧：ANTIGRAVITY -->
      <section class="panel" id="agyPanel">
        <div class="panel-head">
          <div class="brand">
            <span class="brand-name">ANTIGRAVITY</span>
            <span class="plan-badge plan-agy" id="agyPlan">--</span>
            <span class="stale-badge" id="agyStale" style="display:none;"></span>
          </div>
        </div>
        <div class="agy-meters" id="agyMeters"></div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      var stageEl = document.getElementById("stage");
      var clockEl = document.getElementById("clock");
      var dateEl = document.getElementById("date");
      var syncDot = document.getElementById("syncDot");
      var syncInfo = document.getElementById("syncInfo");
      var refreshBtn = document.getElementById("refreshBtn");

      var FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;
      var MAX_RESET_CARDS_DISPLAY = 6;

      function pad(n) {
        return n < 10 ? "0" + n : "" + n;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }

      function updateClock() {
        var d = new Date();
        var weeks = "日一二三四五六";
        clockEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
        dateEl.textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + weeks.charAt(d.getDay());
      }

      // OLED 防烧屏微移：每 60 秒在 ±3px 内平滑移动
      var shifts = [[0, 0], [2, 1], [-2, 2], [-3, -1], [1, -2], [3, 0], [-1, 1]];
      var shiftIdx = 0;
      function pixelShift() {
        shiftIdx = (shiftIdx + 1) % shifts.length;
        var xy = shifts[shiftIdx];
        stageEl.style.transform = "translate(" + xy[0] + "px, " + xy[1] + "px)";
      }

      function formatCountdown(iso, actionLabel) {
        if (!iso) return "";
        var ts = Date.parse(iso);
        if (isNaN(ts)) return "";
        var diffMs = ts - Date.now();
        if (diffMs <= 0) return "即将" + actionLabel;
        var mins = Math.floor(diffMs / 60000);
        var days = Math.floor(mins / 1440);
        var hours = Math.floor((mins % 1440) / 60);
        var remMins = mins % 60;
        if (days > 0) return days + "天" + hours + "时后" + actionLabel;
        if (hours > 0) return hours + "时" + remMins + "分后" + actionLabel;
        return Math.max(1, remMins) + "分后" + actionLabel;
      }

      function formatShortCountdown(iso) {
        if (!iso) return "";
        var ts = Date.parse(iso);
        if (isNaN(ts)) return "";
        var diffMs = ts - Date.now();
        if (diffMs <= 0) return "即将到期";
        var mins = Math.floor(diffMs / 60000);
        var days = Math.floor(mins / 1440);
        var hours = Math.floor((mins % 1440) / 60);
        var remMins = mins % 60;
        if (days > 0) return days + "天" + hours + "时到期";
        if (hours > 0) return hours + "时" + remMins + "分到期";
        return Math.max(1, remMins) + "分到期";
      }

      function formatShortDate(iso) {
        if (!iso) return "--";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "--";
        return pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
      }

      function formatTimeHM(iso) {
        if (!iso) return "--:--";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "--:--";
        return pad(d.getHours()) + ":" + pad(d.getMinutes());
      }

      function isWithinFiveDays(iso) {
        if (!iso) return false;
        var ts = Date.parse(iso);
        if (isNaN(ts)) return false;
        return (ts - Date.now()) <= FIVE_DAYS_MS;
      }

      // 连续平滑色相映射：100% 翠绿(145) -> 50% 暖黄(48) -> 0% 警戒红(4)
      function getQuotaVisual(pct) {
        var p = Math.max(0, Math.min(100, pct));
        var hue;
        if (p >= 50) {
          hue = 48 + ((p - 50) / 50) * (145 - 48);
        } else {
          hue = 4 + (p / 50) * (48 - 4);
        }
        var h1 = Math.max(0, hue - 6);
        var h2 = Math.min(155, hue + 6);
        var barBg = "linear-gradient(90deg, hsl(" + h1.toFixed(1) + ", 78%, 46%), hsl(" + h2.toFixed(1) + ", 85%, 55%))";
        var textColor = "#f8fafc";
        if (p <= 45) {
          var mix = (45 - p) / 45;
          var sat = Math.round(25 + mix * 65);
          var lit = Math.round(96 - mix * 20);
          textColor = "hsl(" + hue.toFixed(1) + ", " + sat + "%, " + lit + "%)";
        }
        return { barBg: barBg, textColor: textColor, isLow: p <= 20 };
      }

      function formatPercentDisplay(remaining) {
        if (remaining > 0 && remaining < 10) {
          return String(Number(remaining.toFixed(1)));
        }
        return String(Math.round(remaining));
      }

      function buildMeterCard(w, tagText, tagClass) {
        var card = el("div", "meter-card");
        var topWrap = el("div");
        topWrap.appendChild(el("span", "meter-tag" + (tagClass ? " " + tagClass : ""), tagText));
        card.appendChild(topWrap);

        var isInactive = Boolean(w && w.inactive);
        var hasPct = !isInactive && w && typeof w.usedPercent === "number" && isFinite(w.usedPercent);

        var valueEl;
        var bottomWrap = el("div");
        var track = el("div", "progress-track");

        if (isInactive) {
          valueEl = el("div", "meter-value inactive", "未激活");
          bottomWrap.appendChild(track);
          bottomWrap.appendChild(el("div", "meter-sub muted", "当前未计入周期"));
        } else if (hasPct) {
          var remaining = Math.max(0, Math.min(100, 100 - w.usedPercent));
          var visual = getQuotaVisual(remaining);
          if (visual.isLow) {
            card.className = "meter-card low-border";
          }
          valueEl = el("div", "meter-value", formatPercentDisplay(remaining));
          valueEl.style.color = visual.textColor;
          valueEl.appendChild(el("small", "", "%"));

          var fill = el("div", "progress-fill");
          fill.style.width = remaining.toFixed(2) + "%";
          fill.style.background = visual.barBg;
          track.appendChild(fill);
          bottomWrap.appendChild(track);

          if (w.resetsAt) {
            var cd = formatCountdown(w.resetsAt, "重置");
            bottomWrap.appendChild(el("div", "meter-sub", cd || ""));
          } else {
            bottomWrap.appendChild(el("div", "meter-sub muted", "未计费"));
          }
        } else {
          valueEl = el("div", "meter-value inactive", "--");
          bottomWrap.appendChild(track);
          bottomWrap.appendChild(el("div", "meter-sub muted", "暂无数据"));
        }

        card.appendChild(valueEl);
        card.appendChild(bottomWrap);
        return card;
      }

      function renderResetCards(rc) {
        var section = document.getElementById("codexResetSection");
        section.textContent = "";

        if (!rc) {
          section.style.display = "none";
          return;
        }
        section.style.display = "flex";

        var rawItems = rc.items || [];
        var validItems = [];
        for (var i = 0; i < rawItems.length; i++) {
          if (rawItems[i] && isFinite(Date.parse(rawItems[i].expiresAt))) {
            validItems.push(rawItems[i]);
          }
        }
        validItems.sort(function (a, b) {
          return Date.parse(a.expiresAt) - Date.parse(b.expiresAt);
        });

        var available = (rc.available !== undefined && rc.available !== null)
          ? Number(rc.available)
          : validItems.length;
        if (isNaN(available) || available < 0) available = 0;

        // 顶部汇总行
        var head = el("div", "reset-head");
        var countWrap = el("div", "reset-count-wrap");
        countWrap.appendChild(el("span", "reset-label", "重置卡"));
        countWrap.appendChild(el("span", "reset-num", String(available)));
        countWrap.appendChild(el("span", "reset-unit", "张"));
        if (available > MAX_RESET_CARDS_DISPLAY) {
          countWrap.appendChild(el("span", "reset-overflow-note", "(仅展示前6张)"));
        }
        head.appendChild(countWrap);

        var nextIso = rc.nextExpiresAt || (validItems.length > 0 ? validItems[0].expiresAt : null);
        if (available > 0 && nextIso) {
          var nextCls = "reset-next-badge" + (isWithinFiveDays(nextIso) ? " urgent" : "");
          head.appendChild(el("span", nextCls, "最近 " + formatShortCountdown(nextIso)));
        }
        section.appendChild(head);

        // 下方自适应框图网格：0 张不显示框图；1~6 张自适应；>6 张只渲染前 6 张，多余部分不渲染框图
        var gridWrap = el("div", "reset-grid-wrap");
        var showCount = Math.min(available, validItems.length, MAX_RESET_CARDS_DISPLAY);

        if (available === 0 || showCount === 0) {
          gridWrap.appendChild(el("div", "reset-empty", available === 0 ? "暂无可用重置卡" : "暂无到期明细"));
        } else {
          var cols = showCount <= 3 ? showCount : (showCount === 4 ? 2 : 3);
          var grid = el("div", "reset-grid cols-" + cols);
          for (var j = 0; j < showCount; j++) {
            var item = validItems[j];
            var chipCls = "card-chip" + (isWithinFiveDays(item.expiresAt) ? " urgent" : "");
            grid.appendChild(el("div", chipCls, formatShortDate(item.expiresAt)));
          }
          gridWrap.appendChild(grid);
        }
        section.appendChild(gridWrap);
      }

      function renderCodex(data) {
        var planEl = document.getElementById("codexPlan");
        var creditsEl = document.getElementById("codexCredits");
        var staleEl = document.getElementById("codexStale");
        var metersEl = document.getElementById("codexMeters");

        metersEl.textContent = "";

        var ok = Boolean(data && data.ok);
        if (!ok) {
          planEl.className = "plan-badge plan-offline";
          planEl.textContent = "OFFLINE";
          creditsEl.textContent = "-- Credits";
          staleEl.style.display = "none";
          metersEl.appendChild(el("div", "error-box", (data && data.error) ? data.error : "Codex 数据拉取失败"));
          renderResetCards(null);
          return;
        }

        planEl.className = "plan-badge plan-codex";
        planEl.textContent = data.plan || "--";

        if (data.creditsRemaining !== undefined && data.creditsRemaining !== null && !isNaN(Number(data.creditsRemaining))) {
          creditsEl.textContent = Number(data.creditsRemaining).toLocaleString() + " Credits";
        } else {
          creditsEl.textContent = "-- Credits";
        }

        if (data.staleError) {
          staleEl.style.display = "inline-block";
          staleEl.textContent = "缓存降级";
          staleEl.title = data.staleError;
        } else {
          staleEl.style.display = "none";
        }

        var windows = (data.windows || []).slice().sort(function (a, b) {
          return (a.windowMinutes || 0) - (b.windowMinutes || 0);
        });

        if (windows.length === 0) {
          metersEl.appendChild(el("div", "error-box", "暂无窗口配额数据"));
        } else {
          for (var i = 0; i < windows.length; i++) {
            var w = windows[i];
            metersEl.appendChild(buildMeterCard(w, w.label || "窗口", ""));
          }
        }

        renderResetCards(data.resetCards);
      }

      function renderAntigravity(data) {
        var planEl = document.getElementById("agyPlan");
        var staleEl = document.getElementById("agyStale");
        var metersEl = document.getElementById("agyMeters");

        metersEl.textContent = "";

        var ok = Boolean(data && data.ok);
        if (!ok) {
          planEl.className = "plan-badge plan-offline";
          planEl.textContent = "OFFLINE";
          staleEl.style.display = "none";
          metersEl.appendChild(el("div", "error-box", (data && data.error) ? data.error : "Antigravity 数据拉取失败"));
          return;
        }

        planEl.className = "plan-badge plan-agy";
        planEl.textContent = data.plan || "--";

        if (data.staleError) {
          staleEl.style.display = "inline-block";
          staleEl.textContent = "缓存降级";
          staleEl.title = data.staleError;
        } else {
          staleEl.style.display = "none";
        }

        var windows = data.windows || [];
        if (windows.length === 0) {
          metersEl.appendChild(el("div", "error-box", "暂无窗口配额数据"));
          return;
        }

        // 按 group 保持原始顺序分组（Gemini 在上行，Claude / GPT 在下行）
        var groupOrder = [];
        var groupMap = {};
        for (var i = 0; i < windows.length; i++) {
          var w = windows[i];
          var gName = w.group || "配额";
          if (!groupMap[gName]) {
            groupMap[gName] = [];
            groupOrder.push(gName);
          }
          groupMap[gName].push(w);
        }

        for (var g = 0; g < groupOrder.length; g++) {
          var name = groupOrder[g];
          var list = groupMap[name].slice().sort(function (a, b) {
            return (a.windowMinutes || 0) - (b.windowMinutes || 0);
          });
          var row = el("div", "agy-row");
          var tagCls = name.toLowerCase().indexOf("gemini") !== -1 ? "tag-gemini" : "tag-3p";
          for (var k = 0; k < list.length; k++) {
            var item = list[k];
            var title = name + " · " + (item.label || "");
            row.appendChild(buildMeterCard(item, title, tagCls));
          }
          metersEl.appendChild(row);
        }
      }

      function setSyncState(state, text) {
        syncDot.className = "sync-dot" + (state === "ok" ? "" : " " + state);
        syncInfo.className = "sync-info" + (state === "loading" ? " warn" : state === "error" ? " error" : "");
        syncInfo.textContent = text;
      }

      function fetchQuota() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/api/quota?t=" + Date.now(), true);
        xhr.timeout = 8000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var data = JSON.parse(xhr.responseText);
              renderCodex(data.codex);
              renderAntigravity(data.antigravity);

              var hm = formatTimeHM(data.fetchedAt);
              var codexOk = Boolean(data.codex && data.codex.ok);
              var agyOk = Boolean(data.antigravity && data.antigravity.ok);
              var allOk = codexOk && agyOk;
              var hasStale = (codexOk && data.codex.staleError) || (agyOk && data.antigravity.staleError);

              if (data.refreshing) {
                setSyncState("loading", "同步中 · " + hm);
              } else if (!allOk) {
                setSyncState("error", "部分异常 · " + hm);
              } else if (hasStale) {
                setSyncState("loading", "使用缓存 · " + hm);
              } else {
                setSyncState("ok", "已同步 · " + hm);
              }
            } catch (e) {
              setSyncState("error", "数据解析异常");
            }
          } else {
            setSyncState("error", "连接服务失败");
          }
        };
        xhr.onerror = function () {
          setSyncState("error", "连接服务失败");
        };
        xhr.ontimeout = function () {
          setSyncState("error", "请求超时");
        };
        xhr.send();
      }

      refreshBtn.addEventListener("click", function () {
        setSyncState("loading", "手动刷新中...");
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/refresh", true);
          xhr.timeout = 5000;
          xhr.send();
        } catch (e) {}
        setTimeout(fetchQuota, 1500);
      });

      updateClock();
      fetchQuota();
      setInterval(updateClock, 5000);
      setInterval(fetchQuota, 15000);
      setInterval(pixelShift, 60000);
    })();
  </script>
</body>
</html>
