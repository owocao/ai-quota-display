<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>AI Quota</title>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0d10;
      --border: #1e2128;
      --text: #e8eaed;
      --muted: #8a909e;
      --dim: #5c6270;
      --ok: #2ecc71;
      --warn: #f1b44c;
      --danger: #e55353;
      --accent-codex: #4fd1c5;
      --accent-agy: #7aa2f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
    }

    /* 外层防烧屏微移容器 */
    .stage {
      width: 100%;
      height: 100%;
      padding: 12px 16px 14px;
      display: flex;
      flex-direction: column;
      transition: transform 1.2s ease-in-out;
    }

    /* 顶栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      margin-bottom: 10px;
      flex-shrink: 0;
      padding: 0 2px;
    }

    .clock-wrap {
      display: flex;
      align-items: baseline;
    }

    .clock {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
      color: #f3f5f8;
      margin-right: 10px;
    }

    .date {
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .sync-wrap {
      display: flex;
      align-items: center;
    }

    .sync-status {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-right: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      margin-right: 6px;
      display: inline-block;
    }

    .dot.loading {
      background: var(--warn);
      animation: pulse 1s infinite;
    }

    .dot.error {
      background: var(--danger);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .btn-refresh {
      background: #14171e;
      color: #b5bccb;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-refresh:active {
      background: #1f2430;
      color: var(--text);
    }

    /* 主体左右双栏（兼容老内核 grid-gap） */
    .grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 14px;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
    }

    .brand-bar {
      width: 4px;
      height: 18px;
      border-radius: 2px;
      margin-right: 9px;
      display: inline-block;
    }

    .brand-bar.codex { background: var(--accent-codex); }
    .brand-bar.agy { background: var(--accent-agy); }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-right: 8px;
    }

    .plan-badge {
      font-size: 10.5px;
      color: var(--muted);
      background: #151821;
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .credits-pill {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-codex);
      font-variant-numeric: tabular-nums;
    }

    /* 配额条目列表 */
    .meters {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: center;
    }

    .meter {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .meter:last-child {
      margin-bottom: 0;
    }

    .meter-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .meter-title {
      font-size: 13px;
      color: #d6dbe5;
      font-weight: 600;
      white-space: nowrap;
    }

    .meter-title .sub {
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px;
      font-size: 11.5px;
    }

    .meter-meta {
      display: flex;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .reset-text {
      font-size: 11.5px;
      color: var(--muted);
      margin-right: 8px;
    }

    .pct {
      font-size: 16px;
      font-weight: 700;
      min-width: 48px;
      text-align: right;
    }

    .pct.ok { color: var(--ok); }
    .pct.warn { color: var(--warn); }
    .pct.danger { color: var(--danger); }
    .pct.dim { color: var(--dim); font-weight: 500; font-size: 12.5px; }

    .track {
      width: 100%;
      height: 8px;
      background: #181b22;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    .fill.ok { background: var(--ok); }
    .fill.warn { background: var(--warn); }
    .fill.danger { background: var(--danger); }
    .fill.dim { background: #2c313d; }

    /* Codex 重置卡区块 */
    .cards-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #181b23;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .cards-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 7px;
    }

    .cards-count {
      font-weight: 700;
      color: #e8eaed;
    }

    .cards-count span {
      color: var(--accent-codex);
      font-size: 16px;
      margin: 0 2px;
    }

    .cards-next {
      font-size: 11.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .cards-next.urgent {
      color: var(--warn);
      font-weight: 600;
    }

    .card-chips {
      display: flex;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: #b5bccb;
      background: #14171f;
      border: 1px solid #222632;
      border-radius: 5px;
      padding: 3px 7px;
      margin-right: 6px;
      margin-bottom: 5px;
    }

    .chip.urgent {
      border-color: rgba(241, 180, 76, 0.55);
      color: var(--warn);
      background: rgba(241, 180, 76, 0.08);
    }

    .error-msg {
      color: var(--danger);
      font-size: 12.5px;
      padding: 8px 0;
      line-height: 1.5;
    }

    .stale-note {
      font-size: 10.5px;
      color: var(--warn);
      margin-top: 6px;
    }

    /* 竖屏自适应兜底 */
    @media (orientation: portrait) {
      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="topbar">
      <div class="clock-wrap">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date">----/--/--</div>
      </div>
      <div class="sync-wrap">
        <div class="sync-status">
          <span class="dot" id="syncDot"></span>
          <span id="syncText">等待同步</span>
        </div>
        <button class="btn-refresh" id="refreshBtn" type="button">刷新</button>
      </div>
    </div>

    <div class="grid">
      <!-- 左侧：Codex -->
      <section class="card" id="codexCard">
        <div class="card-header">
          <div class="brand">
            <span class="brand-bar codex"></span>
            <span class="brand-name">Codex</span>
            <span class="plan-badge" id="codexPlan">--</span>
          </div>
          <div class="credits-pill" id="codexCredits">-- Credits</div>
        </div>
        <div class="meters" id="codexMeters"></div>
        <div class="cards-box" id="codexResetBox"></div>
      </section>

      <!-- 右侧：Antigravity -->
      <section class="card" id="agyCard">
        <div class="card-header">
          <div class="brand">
            <span class="brand-bar agy"></span>
            <span class="brand-name">Antigravity</span>
            <span class="plan-badge" id="agyPlan">--</span>
          </div>
        </div>
        <div class="meters" id="agyMeters"></div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      var stageEl = document.getElementById("stage");
      var clockEl = document.getElementById("clock");
      var dateEl = document.getElementById("date");
      var syncDot = document.getElementById("syncDot");
      var syncText = document.getElementById("syncText");
      var refreshBtn = document.getElementById("refreshBtn");

      function pad(n) {
        return n < 10 ? "0" + n : "" + n;
      }

      function updateClock() {
        var d = new Date();
        var weeks = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        clockEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
        dateEl.textContent = (d.getMonth() + 1) + "/" + d.getDate() + " " + weeks[d.getDay()];
      }

      // OLED 防烧屏微移：每 60 秒在 ±3px 内平滑移动
      var shifts = [[0, 0], [2, 1], [-2, 2], [-3, -1], [1, -2], [3, 0], [-1, 1]];
      var shiftIdx = 0;
      function pixelShift() {
        shiftIdx = (shiftIdx + 1) % shifts.length;
        var pair = shifts[shiftIdx];
        stageEl.style.transform = "translate(" + pair[0] + "px, " + pair[1] + "px)";
      }

      function levelClass(remPct) {
        if (remPct === null || remPct === undefined) return "dim";
        if (remPct <= 10) return "danger";
        if (remPct <= 30) return "warn";
        return "ok";
      }

      function formatRemaining(iso) {
        if (!iso) return "";
        var diffMs = new Date(iso).getTime() - Date.now();
        if (isNaN(diffMs)) return "";
        if (diffMs <= 0) return "即将重置";
        var mins = Math.floor(diffMs / 60000);
        var days = Math.floor(mins / 1440);
        var hours = Math.floor((mins % 1440) / 60);
        var remMins = mins % 60;
        if (days > 0) return days + "天" + hours + "时后";
        if (hours > 0) return hours + "时" + remMins + "分后";
        return remMins + "分后";
      }

      function formatShortDate(iso) {
        if (!iso) return "--";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "--";
        return pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
      }

      function renderMeterRow(title, sub, usedPercent, resetsAt, inactive) {
        var usedNum = (usedPercent === null || usedPercent === undefined) ? 0 : Math.min(100, Math.max(0, usedPercent));
        var remNum = Math.min(100, Math.max(0, 100 - usedNum));
        var lvl = inactive ? "dim" : levelClass(remNum);
        var pctStr = inactive ? "未激活" : ((remNum === 0 || remNum === 100) ? remNum.toFixed(0) : remNum.toFixed(1)) + "%";
        var resetStr = inactive ? "" : (resetsAt ? formatRemaining(resetsAt) : "未计费");
        var subHtml = sub ? '<span class="sub">' + sub + '</span>' : "";
        var barWidth = inactive ? 0 : remNum;
        return '' +
          '<div class="meter">' +
            '<div class="meter-head">' +
              '<div class="meter-title">' + title + subHtml + '</div>' +
              '<div class="meter-meta">' +
                '<span class="reset-text">' + resetStr + '</span>' +
                '<span class="pct ' + lvl + '">' + pctStr + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="track">' +
              '<div class="fill ' + lvl + '" style="width:' + barWidth + '%"></div>' +
            '</div>' +
          '</div>';
      }

      function renderCodex(codex) {
        var planEl = document.getElementById("codexPlan");
        var creditsEl = document.getElementById("codexCredits");
        var metersEl = document.getElementById("codexMeters");
        var resetBox = document.getElementById("codexResetBox");

        if (!codex || !codex.ok) {
          planEl.textContent = "OFFLINE";
          creditsEl.textContent = "--";
          metersEl.innerHTML = '<div class="error-msg">' + ((codex && codex.error) || "暂无数据") + '</div>';
          resetBox.innerHTML = "";
          return;
        }

        planEl.textContent = codex.plan || "Plus";
        if (codex.creditsRemaining !== null && codex.creditsRemaining !== undefined) {
          creditsEl.textContent = Number(codex.creditsRemaining).toLocaleString() + " Credits";
        } else {
          creditsEl.textContent = "-- Credits";
        }

        var windows = codex.windows || [];
        var html = "";
        for (var i = 0; i < windows.length; i++) {
          var w = windows[i];
          html += renderMeterRow(w.label, "", w.usedPercent, w.resetsAt, w.inactive);
        }
        if (codex.staleError) {
          html += '<div class="stale-note">上次刷新异常（显示缓存）：' + codex.staleError + '</div>';
        }
        metersEl.innerHTML = html;

        var rc = codex.resetCards || { available: 0, items: [] };
        var items = rc.items || [];
        var urgentNext = false;
        var nextDesc = "无可用卡";
        if (rc.nextExpiresAt) {
          var diffDays = (new Date(rc.nextExpiresAt).getTime() - Date.now()) / 86400000;
          urgentNext = diffDays <= 5;
          nextDesc = "最近到期 " + formatRemaining(rc.nextExpiresAt);
        }

        var chips = "";
        var maxChips = Math.min(items.length, 6);
        for (var j = 0; j < maxChips; j++) {
          var item = items[j];
          var dDays = (new Date(item.expiresAt).getTime() - Date.now()) / 86400000;
          var cls = dDays <= 5 ? "chip urgent" : "chip";
          chips += '<span class="' + cls + '">' + formatShortDate(item.expiresAt) + '</span>';
        }

        var avail = (rc.available !== null && rc.available !== undefined) ? rc.available : 0;
        resetBox.innerHTML = '' +
          '<div class="cards-head">' +
            '<div class="cards-count">重置卡 <span>' + avail + '</span> 张</div>' +
            '<div class="cards-next ' + (urgentNext ? "urgent" : "") + '">' + nextDesc + '</div>' +
          '</div>' +
          '<div class="card-chips">' + (chips || '<span class="chip">无</span>') + '</div>';
      }

      function renderAgy(agy) {
        var planEl = document.getElementById("agyPlan");
        var metersEl = document.getElementById("agyMeters");

        if (!agy || !agy.ok) {
          planEl.textContent = "OFFLINE";
          metersEl.innerHTML = '<div class="error-msg">' + ((agy && agy.error) || "暂无数据") + '</div>';
          return;
        }

        planEl.textContent = agy.plan || "Pro";
        var windows = agy.windows || [];
        var html = "";
        for (var i = 0; i < windows.length; i++) {
          var w = windows[i];
          html += renderMeterRow(w.group, w.label, w.usedPercent, w.resetsAt, false);
        }
        if (agy.staleError) {
          html += '<div class="stale-note">上次刷新异常（显示缓存）：' + agy.staleError + '</div>';
        }
        metersEl.innerHTML = html;
      }

      function fetchQuota() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/api/quota?t=" + Date.now(), true);
        xhr.timeout = 8000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var data = JSON.parse(xhr.responseText);
              renderCodex(data.codex);
              renderAgy(data.antigravity);

              if (data.refreshing) {
                syncDot.className = "dot loading";
                syncText.textContent = "同步中...";
              } else if (data.fetchedAt) {
                var allOk = data.codex && data.codex.ok && data.antigravity && data.antigravity.ok;
                syncDot.className = allOk ? "dot" : "dot error";
                var d = new Date(data.fetchedAt);
                syncText.textContent = "更新 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
              }
            } catch (e) {
              syncDot.className = "dot error";
              syncText.textContent = "解析异常";
            }
          } else {
            syncDot.className = "dot error";
            syncText.textContent = "连接电脑失败";
          }
        };
        xhr.onerror = function () {
          syncDot.className = "dot error";
          syncText.textContent = "连接电脑失败";
        };
        xhr.send();
      }

      refreshBtn.addEventListener("click", function () {
        syncDot.className = "dot loading";
        syncText.textContent = "手动刷新...";
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/refresh", true);
          xhr.send();
        } catch (e) {}
        setTimeout(fetchQuota, 1500);
      });

      updateClock();
      fetchQuota();
      setInterval(updateClock, 5000);
      setInterval(fetchQuota, 15000);
      setInterval(pixelShift, 60000);
    })();
  </script>
</body>
</html>
